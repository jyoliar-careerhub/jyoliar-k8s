apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: bootstrap
            path: gitops/overlays/aws-ec2/bootstrap
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      source:
        repoURL: git@github.com:jyoliar-careerhub/onpremise-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
