apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd                                                                                                                                                                                                
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # 다른 리소스보다 먼저 생성
spec:
  description: Bootstrap applications for cluster infrastructure
  sourceRepos:
    - git@github.com:jae2274/jyoliar-k8s.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
