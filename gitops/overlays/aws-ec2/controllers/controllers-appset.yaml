apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: controllers
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: nginx-gateway
            path: gitops/overlays/aws-ec2/controllers/nginx-gateway
            namespace: nginx-gateway
          - name: prometheus-operator
            path: gitops/overlays/aws-ec2/controllers/prometheus-operator
            namespace: prometheus
  template:
    metadata:
      name: "{{ .name }}"
      namespace: "{{ .namespace }}"
    spec:
      project: controllers
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
