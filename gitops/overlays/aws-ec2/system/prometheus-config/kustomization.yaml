apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus

resources:
  - ../../../../base/system/prometheus-config

patches:
- target:
    kind: HTTPRoute
    name: alertmanager-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - alertmanager.aws-ec2.jyoliar.com
- target:
    kind: HTTPRoute
    name: grafana-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - grafana.aws-ec2.jyoliar.com
- target:
    kind: HTTPRoute
    name: prometheus-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - prometheus.aws-ec2.jyoliar.com
