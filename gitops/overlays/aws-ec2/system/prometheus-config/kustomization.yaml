apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus

resources:
  - ../../../../base/system/prometheus-config

patches:
- target:
    kind: HTTPRoute
    name: grafana-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - grafana.jyo-liar.com
