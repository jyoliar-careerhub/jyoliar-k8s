apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: controllers
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: nginx-gateway
            path: gitops/overlays/baremetal/controllers/nginx-gateway
            namespace: nginx-gateway
          - name: prometheus-operator
            path: gitops/overlays/baremetal/controllers/prometheus-operator
            namespace: prometheus
          - name: mongodb-operator
            path: gitops/overlays/baremetal/controllers/mongodb-operator
            namespace: mongodb
          - name: cloudnativepg
            path: gitops/overlays/baremetal/controllers/cloudnativepg
            namespace: cnpg-system
          - name: external-dns
            path: gitops/overlays/baremetal/controllers/external-dns
            namespace: external-dns
          - name: cert-manager
            path: gitops/overlays/baremetal/controllers/cert-manager
            namespace: cert-manager
          - name: loki
            path: gitops/overlays/baremetal/controllers/loki
            namespace: prometheus
          - name: alloy
            path: gitops/overlays/baremetal/controllers/alloy
            namespace: prometheus
  template:
    metadata:
      name: "{{ .name }}"
      namespace: "{{ .namespace }}"
    spec:
      project: controllers
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
