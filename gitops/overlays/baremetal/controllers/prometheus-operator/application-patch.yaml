apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-helm
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        grafana:
          # 시크릿(client_id/secret)을 env로 주입 — values에 평문 없음.
          # base의 additionalDataSources(Loki/Tempo)는 merge로 보존됨.
          envFromSecret: grafana-oauth
          grafana.ini:
            server:
              root_url: https://grafana.mg.jyo-liar.com
            auth.generic_oauth:
              enabled: true
              name: Google
              scopes: openid email profile
              auth_url: https://accounts.google.com/o/oauth2/v2/auth
              token_url: https://oauth2.googleapis.com/token
              api_url: https://openidconnect.googleapis.com/v1/userinfo
              # 개인 Gmail은 groups 없음 → 이메일로 역할 결정. 매칭 외에는 '' 반환.
              role_attribute_path: "email == 'jyo.liar@gmail.com' && 'GrafanaAdmin' || ''"
              role_attribute_strict: true # 역할 '' → 로그인 거부(허용 이메일 외 전면 차단)
              allow_assign_grafana_admin: true
              # auto_login 비활성 → 로그인 폼/basic auth 유지(break-glass)
        alertmanager:
          config:
            route:
              group_interval: 1m
          alertmanagerSpec:
            # HA 2-replica — 단일 replica 시절 배포 노드 사망 = 알럿 전면 침묵의 재발 방지.
            # gossip 클러스터가 형성되며 alertmanager_cluster_members가 노출되어
            # Alertmanager{MembersInconsistent,ClusterDown,...} 알럿의 데이터 원천이 생긴다.
            # 알림 중복은 notification log gossip이 흡수 (ops-workflow#26)
            replicas: 2
            # 두 replica가 같은 노드에 못 앉게 강제 — soft(기본)면 HA 목적이 보장되지 않음
            podAntiAffinity: hard
        prometheus:
          prometheusSpec:
            retention: 30d
            # 크기 상한 — WAL 포함 계산이므로 PVC(40Gi≈42.9GB)보다 낮게 유지해야 한다.
            # 이게 없으면 시간 보존(30d)만으로는 디스크 만석을 막을 수 없다(#24).
            retentionSize: 34GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 40Gi
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Filesystem
                  storageClassName: longhorn
