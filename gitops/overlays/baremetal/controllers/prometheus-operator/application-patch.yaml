apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-helm
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        alertmanager:
          config:
            route:
              group_interval: 1m
        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 30Gi
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Filesystem
                  storageClassName: longhorn
