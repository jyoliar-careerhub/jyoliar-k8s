apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: system
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: prerequisites
            path: gitops/overlays/baremetal/system/prerequisites
            phase: "1"
          - name: nginx-gateway-config
            path: gitops/overlays/baremetal/system/nginx-gateway-config
            phase: "2"
          - name: argocd-config
            path: gitops/overlays/baremetal/system/argocd-config
            phase: "3"
          - name: prometheus-config
            path: gitops/overlays/baremetal/system/prometheus-config
            phase: "3"
          # grafana-config: grafana-operator가 관리하는 CR(Grafana external + Viewer SA).
          # operator(controllers)는 이미 설치돼 있으므로 phase 3에서 동기화.
          - name: grafana-config
            path: gitops/overlays/baremetal/system/grafana-config
            phase: "3"
          - name: cert-manager-config
            path: gitops/overlays/baremetal/system/cert-manager-config
            phase: "2"
          # agent-credentials: 로컬 Claude Code agent별 SA·토큰·RBAC (의존 없음)
          - name: agent-credentials
            path: gitops/overlays/baremetal/system/agent-credentials
            phase: "2"
          - name: kagent-config
            path: gitops/overlays/baremetal/system/kagent-config
            phase: "2"
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: system-phase
              operator: In
              values: ["1"]
        - matchExpressions:
            - key: system-phase
              operator: In
              values: ["2"]
        - matchExpressions:
            - key: system-phase
              operator: In
              values: ["3"]
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        system-phase: "{{ .phase }}"
    spec:
      project: system
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
