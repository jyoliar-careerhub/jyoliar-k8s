apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: system
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: nginx-gateway-config
            path: gitops/overlays/baremetal/system/nginx-gateway-config
          - name: argocd-config
            path: gitops/overlays/baremetal/system/argocd-config
          - name: prometheus-config
            path: gitops/overlays/baremetal/system/prometheus-config
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: system
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
