apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
spec:
  route:
    receiver: 'info-slack-notifications'
    groupBy: [severity, alertname]
    routes:
      - receiver: 'info-slack-notifications'
        repeatInterval: 24h
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: 'critical-slack-notifications'
        matchers:
          - name: severity
            value: critical
            matchType: =
      - receiver: 'warn-slack-notifications'
        matchers:
          - name: severity
            value: warning
            matchType: =
  receivers:
    - name: 'info-slack-notifications'
      slackConfigs:
        - apiURL:
            name: alert-slack-webhook
            key: info
          channel: '#alerts'
          sendResolved: true
          color: '{{ if eq .Status "firing" }}#2EB67D{{ else }}#2EB67D{{ end }}'
          title: |-
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          text: |-
            {{ range .Alerts }}
            *{{ .Labels.severity }}* - {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
    - name: 'warn-slack-notifications'
      slackConfigs:
        - apiURL:
            name: alert-slack-webhook
            key: warn
          channel: '#alerts'
          sendResolved: true
          color: '{{ if eq .Status "firing" }}#ECB22E{{ else }}#2EB67D{{ end }}'
          title: |-
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          text: |-
            {{ range .Alerts }}
            *{{ .Labels.severity }}* - {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
    - name: 'critical-slack-notifications'
      slackConfigs:
        - apiURL:
            name: alert-slack-webhook
            key: critical
          channel: '#alerts'
          sendResolved: true
          color: '{{ if eq .Status "firing" }}#E01E5A{{ else }}#2EB67D{{ end }}'
          title: |-
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          text: |-
            {{ range .Alerts }}
            *{{ .Labels.severity }}* - {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
