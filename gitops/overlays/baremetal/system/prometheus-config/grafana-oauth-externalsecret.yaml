apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
    # secretKey 이름을 Grafana env override 형식으로 → envFromSecret가 grafana.ini를 덮어씀
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "/jyo-liar/k8s/baremetal/admin/prod/oauth/google-client"
        metadataPolicy: None
        property: GOOGLE_CLIENT_ID
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "/jyo-liar/k8s/baremetal/admin/prod/oauth/google-client"
        metadataPolicy: None
        property: GOOGLE_CLIENT_SECRET
