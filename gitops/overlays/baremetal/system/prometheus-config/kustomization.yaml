apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus

resources:
  - ../../../../base/system/prometheus-config
  - alert-slack-webhook-secret.yaml
  - alertmanagerconfig.yaml
  - grafana-oauth-externalsecret.yaml

patches:
- target:
    kind: HTTPRoute
    name: alertmanager-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - alertmanager.mg.jyo-liar.com
- target:
    kind: HTTPRoute
    name: grafana-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - grafana.mg.jyo-liar.com
- target:
    kind: HTTPRoute
    name: prometheus-httproute
  patch: |-
    - op: replace
      path: /spec/hostnames
      value:
      - prometheus.mg.jyo-liar.com
