apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critical-slack-webhook
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: critical-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: "/jyo-liar/k8s/baremetal/discord/critical/slack-webhook-url"
