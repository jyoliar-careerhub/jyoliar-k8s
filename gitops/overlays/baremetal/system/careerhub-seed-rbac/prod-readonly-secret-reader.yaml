# careerhub-stg 의 ServiceAccount 가 careerhub-prod 에서 읽을 수 있는 것은 이 Secret 하나다 —
# resourceNames 로 좁혔으므로 다른 Secret(admin · app · migrator 비밀번호)은 읽지 못한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stg-seed-mongodb-readonly-reader
  namespace: careerhub-prod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mongodb-readonly-password"]
    verbs: ["get"]
  # External Secrets 의 Kubernetes provider 가 SecretStore 검증에 쓴다
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stg-seed-mongodb-readonly-reader
  namespace: careerhub-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stg-seed-mongodb-readonly-reader
subjects:
  - kind: ServiceAccount
    name: mongodb-seed-prod-reader
    namespace: careerhub-stg
