apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# careerhub-stg-seed-rbac: stg 의 MongoDB 복사 Job 이 prod 의 읽기 전용 자격을 읽게 하는 권한.
# careerhub-prod 에 사는 Role 이라 stg 프로젝트(대상 네임스페이스가 careerhub-stg 뿐)가 아니라 system 층에 둔다.
# 받는 쪽(SecretStore · ExternalSecret · CronJob)은 services/careerhub/stg/mongodb 에 있다.

resources:
  - prod-readonly-secret-reader.yaml
