kind: ExternalSecret
metadata:
  name: kagent-openai
  namespace: kagent
spec:
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "/jyo-liar/k8s/baremetal/kagent/openai-api-key"
        metadataPolicy: None
