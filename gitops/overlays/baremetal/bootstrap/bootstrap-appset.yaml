apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: argocd
            path: gitops/overlays/baremetal/bootstrap/argocd
            namespace: argocd
          - name: external-secrets-resources
            path: gitops/overlays/baremetal/bootstrap/external-secrets-resources
            namespace: argocd
          - name: cloudflare-tunnel
            path: gitops/overlays/baremetal/bootstrap/cloudflare-tunnel
            namespace: cloudflare-system
          - name: oidc-provider
            path: gitops/overlays/baremetal/bootstrap/oidc-provider
            namespace: oidc-provider
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: bootstrap
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
