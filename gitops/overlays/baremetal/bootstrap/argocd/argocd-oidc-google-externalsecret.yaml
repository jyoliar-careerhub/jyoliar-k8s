apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-google
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # argocd-cm 패치보다 먼저 생성
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: argocd-oidc-google
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd # argocd-cm의 $argocd-oidc-google:참조 요건
  data:
    - secretKey: clientID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "/jyo-liar/k8s/baremetal/admin/prod/oauth/google-client"
        metadataPolicy: None
        property: GOOGLE_CLIENT_ID
    - secretKey: clientSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "/jyo-liar/k8s/baremetal/admin/prod/oauth/google-client"
        metadataPolicy: None
        property: GOOGLE_CLIENT_SECRET
