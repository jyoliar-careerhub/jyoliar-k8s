apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-agents
  namespace: argocd
spec:
  sourceRepos:
    - git@github.com:jae2274/jyoliar-k8s.git
  destinations:
    - namespace: ai-agents
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    # mcps/grafana(mcp-grafana)는 GrafanaServiceAccount 토큰을 same-ns로 읽기 위해 prometheus ns에 배치.
    - namespace: prometheus
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
