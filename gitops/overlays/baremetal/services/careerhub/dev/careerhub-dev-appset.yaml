apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: careerhub-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: careerhub-dev-mongodb
            path: gitops/overlays/baremetal/services/careerhub/dev/mongodb
          # - name: careerhub-dev-apps
          #   path: gitops/overlays/baremetal/services/careerhub/dev/apps
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: careerhub-dev
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: careerhub-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
