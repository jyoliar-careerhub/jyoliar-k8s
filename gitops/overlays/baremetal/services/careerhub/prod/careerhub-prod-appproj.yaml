apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: careerhub-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: CareerHub prod environment
  sourceRepos:
    - git@github.com:jae2274/jyoliar-k8s.git
  destinations:
    - namespace: careerhub-prod
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
