apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: careerhub-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: careerhub-prod-mongodb
            path: gitops/overlays/baremetal/services/careerhub/prod/mongodb
            phase: "1"
          - name: careerhub-prod-apps
            path: gitops/overlays/baremetal/services/careerhub/prod/apps
            phase: "2"
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: careerhub-phase
              operator: In
              values: ["1"]
        - matchExpressions:
            - key: careerhub-phase
              operator: In
              values: ["2"]
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        careerhub-phase: "{{ .phase }}"
    spec:
      project: careerhub-prod
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: careerhub-prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
