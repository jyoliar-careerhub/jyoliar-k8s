# 복구 실측 검증용 임시 클러스터 (jyoliar-lab/ops-workflow#49 AC#2)
#
# S3의 base backup + WAL만으로 PostgreSQL이 실제로 되살아나는지 확인한다.
# 원본(careerhub-postgresql)은 건드리지 않는다 — 복구는 언제나 새 Cluster다.
# 검증이 끝나면 이 파일을 지우는 PR로 정리한다.
#
# 이름의 `-restore` 접미는 IAM 신뢰 정책이 알고 있는 규약이다
# (jyoliar-careerhub/jyoliar-platform-terraform#3).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: careerhub-postgresql-restore
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3

  # 물리 백업이라 원본과 같은 메이저 버전으로만 되살아난다.
  bootstrap:
    recovery:
      source: careerhub-postgresql-source

  externalClusters:
    - name: careerhub-postgresql-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: careerhub-postgresql-backup
          # 버킷 안에서 원본을 가리키는 이름 — 원본 Cluster 이름이다.
          serverName: careerhub-postgresql

  # 아카이빙은 켜지 않는다(spec.plugins 없음). 켜면 원본과 같은 serverName
  # 경로에 WAL을 밀어 넣어 백업 카탈로그를 오염시킨다.

  # 복구 잡도 이 토큰으로 S3를 읽는다 — 잡 파드는 이 Cluster의 spec에서
  # 볼륨을 받으므로 여기에도 있어야 한다.
  projectedVolumeTemplate:
    sources:
      - serviceAccountToken:
          audience: sts.amazonaws.com
          expirationSeconds: 86400
          path: aws-token

  # 원본 실사용량은 PGDATA 0.27Gi · WAL 0.74Gi다. 임시 검증용이라 원본
  # (10Gi/2Gi)을 그대로 잡지 않고 여유만 남긴다.
  storage:
    size: 5Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn

  priorityClassName: database-dev

  affinity:
    tolerations:
      - key: node.longhorn.io/storage
        operator: Exists
        effect: PreferNoSchedule
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.longhorn.io/create-default-disk
                operator: In
                values:
                  - "true"
