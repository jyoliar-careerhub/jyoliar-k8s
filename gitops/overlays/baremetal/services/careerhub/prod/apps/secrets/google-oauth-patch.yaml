apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth
spec:
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: "/jyo-liar/k8s/baremetal/careerhub/prod/oauth/google-client"
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: "/jyo-liar/k8s/baremetal/careerhub/prod/oauth/google-client"
        property: GOOGLE_CLIENT_SECRET
    - secretKey: GOOGLE_REDIRECT_URL
      remoteRef:
        key: "/jyo-liar/k8s/baremetal/careerhub/prod/oauth/google-client"
        property: GOOGLE_REDIRECT_URL
