apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel-helm
  namespace: argocd
spec:
  destination:
    namespace: careerhub-prod
  project: careerhub-prod-apps
  source:
    helm:
      valuesObject:
        zitadel:
          configmapConfig:
            # 호스트 판정: #51(신규 호스트, *.careerhub 네임스페이스) + 사용자 합의.
            ExternalDomain: id.careerhub.jyo-liar.com
        gateway:
          httpRoute:
            hostnames:
              - id.careerhub.jyo-liar.com
        login:
          gateway:
            httpRoute:
              hostnames:
                - id.careerhub.jyo-liar.com
