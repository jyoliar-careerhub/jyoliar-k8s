# Zitadel 구성 선언의 환경값 — careerhub-prod.
# base 선언(config/zitadel-config.yaml)과 같은 모양으로, 환경마다 다른 필드만 적는다.
# 이 파일의 주석은 렌더된 ConfigMap에 실리지 않는다 — 저장소에서 읽는 사람을 위한 것이다.
apiVersion: careerhub.jyo-liar.com/v1alpha1
kind: ZitadelConfig
metadata:
  name: zitadel-config
spec:
  project:
    apps:
      careerhub-web:
        oidc:
          # redirect URI는 여전히 잠정값이다 — careerhub-web의 최종 호스트가 미확정이고
          # (careerhub/260810_2252 status: active), 확정되면 이 patch만 고치면 된다.
          #
          # localhost 항목은 **검증 전용**이다 (ops-workflow#59): careerhub-web은 아직
          # 어디에도 배포돼 있지 않아, 로그인 완주·토큰 크기 실측을 확인할 곳이 개발기뿐이다.
          # 제거 조건 — careerhub-web이 실제 호스트에 서고 그 호스트로 실증이 되는 시점.
          redirectUris:
            - https://careerhub.jyo-liar.com/auth/callback
            - http://localhost:3000/auth/callback
          postLogoutRedirectUris:
            - https://careerhub.jyo-liar.com/
            - http://localhost:3000/
          # devMode — 위 http·localhost를 Zitadel이 받게 하는 스위치다. 규격 검사를 느슨하게
          # 하므로 이 앱에 한정되고, localhost 항목과 수명을 같이한다(함께 지운다).
          devMode: true
