# Zitadel 내부 구성의 원하는 상태 — careerhub-prod.
# 구성 Job(base config/apply-zitadel-config.sh)이 이 선언을 관리 API로 수렴시킨다.
# {$env: NAME}은 Job env 값으로 치환된다 — 시크릿이 git에 실리지 않는 배선.

idps:
  # 새 브로커 추가 = 여기 항목 추가 (+ 시크릿이 필요하면 Job env 쌍 배선).
  # type이 admin API 경로(/admin/v1/idps/<type>)가 된다 — Naver(추후 예정)는
  # generic_oidc로 붙는다(ADR-0030). 스크립트에 제공자 전용 분기는 없다.
  - name: Google
    type: google
    addToLoginPolicy: true
    config:
      clientId: {$env: IDP_GOOGLE_CLIENT_ID}
      clientSecret: {$env: IDP_GOOGLE_CLIENT_SECRET}
      scopes: [openid, profile, email]
      providerOptions:
        isLinkingAllowed: true
        isCreationAllowed: true
        isAutoCreation: true
        isAutoUpdate: true
        autoLinking: AUTO_LINKING_OPTION_EMAIL

project:
  name: careerhub
  apps:
    - name: careerhub-web
      # 앱 자격증명 접점 — 구성 Job이 수렴 후 이 이름의 k8s Secret에 client_id를
      # 기록한다(같은 ns). 소비자는 이 Secret을 참조한다. careerhub-web은 public
      # client(authMethodType NONE)라 client_secret이 존재하지 않는다 — secret
      # 인증(BASIC·POST) 앱이라면 client_secret 키도 함께 실린다.
      credentialsSecret: zitadel-app-careerhub-web
      oidc:
        # redirect URI는 여전히 잠정값이다 — careerhub-web의 최종 호스트가 미확정이고
        # (careerhub/260810_2252 status: active), 확정되면 이 선언만 고치면 된다.
        #
        # localhost 항목은 **검증 전용**이다 (ops-workflow#59): careerhub-web은 아직
        # 어디에도 배포돼 있지 않아, 로그인 완주·토큰 크기 실측을 확인할 곳이 개발기뿐이다.
        # 제거 조건 — careerhub-web이 실제 호스트에 서고 그 호스트로 실증이 되는 시점.
        redirectUris:
          - https://careerhub.jyo-liar.com/auth/callback
          - http://localhost:3000/auth/callback
        postLogoutRedirectUris:
          - https://careerhub.jyo-liar.com/
          - http://localhost:3000/
        # devMode — 위 http·localhost를 Zitadel이 받게 하는 스위치다. 규격 검사를 느슨하게
        # 하므로 이 앱에 한정되고, localhost 항목과 수명을 같이한다(함께 지운다).
        devMode: true
        responseTypes: [OIDC_RESPONSE_TYPE_CODE]
        grantTypes:
          - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
          - OIDC_GRANT_TYPE_REFRESH_TOKEN
        appType: OIDC_APP_TYPE_USER_AGENT
        authMethodType: OIDC_AUTH_METHOD_TYPE_NONE
        # JWT 액세스 토큰 — 로컬 검증(ADR-0029)·발급 시점 주입(ADR-0031)의 전제.
        accessTokenType: OIDC_TOKEN_TYPE_JWT

actions:
  targets:
    - name: auth-service-claims
      # 같은 ns의 auth-service 발급 훅 표면(spec/issuance-hook) — ns 무관 상대참조.
      endpoint: http://auth-service:8081/claims
      timeout: 5s
      restCall:
        # fail-closed (#55 D1, 사람 판정 2026-08-12): 빈 클레임 토큰은 앱에서
        # 어차피 정상 동작하지 않고, 조용한 실패는 탐지가 어렵다 — auth-service
        # 장애를 로그인 실패로 드러낸다. function execution은 인스턴스 전역
        # 발화라 타 프로젝트 로그인도 함께 묶인다는 것을 알고 켠 스위치다.
        interruptOnError: true
  executions:
    - function: preaccesstoken
      targets: [auth-service-claims]
    - function: preuserinfo
      targets: [auth-service-claims]
