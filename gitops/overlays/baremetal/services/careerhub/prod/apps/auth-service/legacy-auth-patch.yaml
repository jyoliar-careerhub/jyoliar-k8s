# 레거시 세대(auth-service v0.2.x) 배선 — base 는 신 세대(OIDC)다.
# prod 는 컷오버(#79)까지 레거시 이미지로 돌므로, base 의 OIDC env 를 지우고
# Google OAuth env · jwt-secretkey 를 되살린다. 컷오버의 env 전환 = 이 파일 삭제.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  template:
    spec:
      containers:
        - name: auth-service
          env:
            - name: OIDC_ISSUER
              $patch: delete
            - name: OIDC_AUDIENCE
              $patch: delete
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_REDIRECT_URL
          envFrom:
            - secretRef:
                name: jwt-secretkey
