apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: careerhub-stg
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # 항목은 overlay 가 생길 때 더한다 — mongodb · postgresql 은 phase "1", apps 는 phase "2" (prod 와 같은 묶음)
    - list:
        elements:
          - name: careerhub-stg-mongodb
            path: gitops/overlays/baremetal/services/careerhub/stg/mongodb
            phase: "1"
          - name: careerhub-stg-postgresql
            path: gitops/overlays/baremetal/services/careerhub/stg/postgresql
            phase: "1"
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: careerhub-phase
              operator: In
              values: ["1"]
        - matchExpressions:
            - key: careerhub-phase
              operator: In
              values: ["2"]
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        careerhub-phase: "{{ .phase }}"
    spec:
      project: careerhub-stg
      source:
        repoURL: git@github.com:jyoliar-careerhub/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: careerhub-stg
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
