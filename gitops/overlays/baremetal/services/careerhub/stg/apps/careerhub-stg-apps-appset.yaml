apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: careerhub-stg-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # gateway · secrets · zitadel 은 phase "1", 서비스는 "2", jobs 는 "3" (prod 와 같은 묶음) — 레거시 frontend 는 stg 에 두지 않는다
    - list:
        elements:
          - name: careerhub-stg-gateway
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/gateway
            phase: "1"
          - name: careerhub-stg-secrets
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/secrets
            phase: "1"
          - name: careerhub-stg-zitadel
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/zitadel
            phase: "1"
          - name: careerhub-stg-review-grpc
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/review-grpc
            phase: "2"
          - name: careerhub-stg-posting-grpc
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/posting-grpc
            phase: "2"
          - name: careerhub-stg-userinfo-grpc
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/userinfo-grpc
            phase: "2"
          - name: careerhub-stg-api-composer
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/api-composer
            phase: "2"
          - name: careerhub-stg-auth-service
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/auth-service
            phase: "2"
          - name: careerhub-stg-jobs
            path: gitops/overlays/baremetal/services/careerhub/stg/apps/jobs
            phase: "3"
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: apps-phase
              operator: In
              values: ["1"]
        - matchExpressions:
            - key: apps-phase
              operator: In
              values: ["2"]
        - matchExpressions:
            - key: apps-phase
              operator: In
              values: ["3"]
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        apps-phase: "{{ .phase }}"
    spec:
      project: careerhub-stg-apps
      source:
        repoURL: git@github.com:jyoliar-careerhub/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: careerhub-stg
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
