# stg 공개 Gateway 는 터널 뒤가 아니라 VIP 로 직접 받는다.
# - kube-vip 가 주소를 주도록 라벨을 단다
# - TLS 를 Cloudflare 가 종단하지 않으므로 HTTPS 리스너를 연다(인증서는 내부 Gateway 와 같은 wildcard)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: careerhub-public-gateway
spec:
  infrastructure:
    labels:
      implementation: kube-vip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-careerhub-tls
      allowedRoutes:
        namespaces:
          from: All
