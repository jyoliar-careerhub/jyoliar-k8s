# 터널 홉이 없으니 LoadBalancer 로 연다(내부 Gateway 와 같은 설정).
# rewriteClientIP 는 cloudflared 파드 대역을 신뢰하는 터널 전용 설정이라 걷는다.
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: careerhub-public-nginx-proxy
spec:
  kubernetes:
    service:
      type: LoadBalancer
      externalTrafficPolicy: Cluster
  rewriteClientIP:
