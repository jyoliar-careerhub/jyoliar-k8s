# prod MongoDB 의 읽기 전용 사용자(mongodb-readonly) 비밀번호를 careerhub-stg 로 가져오는 경로.
# Secret 은 네임스페이스를 넘지 못하므로 External Secrets 의 Kubernetes provider 로 읽는다 — 값은 git 에 없다.
#  - 이 ServiceAccount 가 careerhub-prod 에서 읽을 수 있는 것은 Secret mongodb-readonly-password 하나다.
#    그 Role · RoleBinding 은 careerhub-prod 에 살아야 해서 system 층(careerhub-seed-rbac)이 선언한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-seed-prod-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: careerhub-prod-mongodb-readonly
spec:
  provider:
    kubernetes:
      remoteNamespace: careerhub-prod
      server:
        # 같은 클러스터 — url 은 생략하고 in-cluster CA 만 지정한다
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: mongodb-seed-prod-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prod-mongodb-readonly-password
spec:
  secretStoreRef:
    kind: SecretStore
    name: careerhub-prod-mongodb-readonly
  refreshInterval: 1h
  target:
    name: prod-mongodb-readonly-password
  data:
    - secretKey: password
      remoteRef:
        key: mongodb-readonly-password
        property: password
