apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: bootstrap
            path: gitops/overlays/baremetal/bootstrap
          - name: controllers
            path: gitops/overlays/baremetal/controllers
          - name: system
            path: gitops/overlays/baremetal/system
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      source:
        repoURL: git@github.com:jae2274/jyoliar-k8s.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
