apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: google-oauth
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: "REPLACE_WITH_ENVIRONMENT_SPECIFIC_KEY"
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: "REPLACE_WITH_ENVIRONMENT_SPECIFIC_KEY"
        property: GOOGLE_CLIENT_SECRET
    - secretKey: GOOGLE_REDIRECT_URL
      remoteRef:
        key: "REPLACE_WITH_ENVIRONMENT_SPECIFIC_KEY"
        property: GOOGLE_REDIRECT_URL
