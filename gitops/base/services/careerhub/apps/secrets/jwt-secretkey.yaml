apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: jwt-secretkey
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 16
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secretkey
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: jwt-secretkey
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: jwt-secretkey
