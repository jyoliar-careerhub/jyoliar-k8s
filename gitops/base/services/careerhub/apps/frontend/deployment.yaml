apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: frontend
          image: FRONTEND
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "/api"
            - name: AUTH_URL
              value: "/auth"
