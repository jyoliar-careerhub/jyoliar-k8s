apiVersion: apps/v1
kind: Deployment
metadata:
  name: userinfo-service
  labels:
    app: userinfo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: userinfo-service
  template:
    metadata:
      labels:
        app: userinfo-service
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: userinfo-service
          image: USERINFO_SERVICE
          ports:
            - name: restapi-grpc
              containerPort: 50051
            - name: suggester-grpc
              containerPort: 50052
          env:
            - name: RUN_MODE
              value: "app"
            - name: RESTAPI_GRPC_PORT
              value: "50051"
            - name: SUGGESTER_GRPC_PORT
              value: "50052"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: careerhub-mongodb-userinfo-userinfo-app
                  key: connectionString.standardSrv
