apiVersion: apps/v1
kind: Deployment
metadata:
  name: userinfo-service
  labels:
    app: userinfo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: userinfo-service
  template:
    metadata:
      labels:
        app: userinfo-service
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: userinfo-service
          image: USERINFO_SERVICE
          ports:
            - name: restapi-grpc
              containerPort: 50051
            - name: suggester-grpc
              containerPort: 50052
          env:
            - name: RUN_MODE
              value: "app"
            - name: RESTAPI_GRPC_PORT
              value: "50051"
            - name: SUGGESTER_GRPC_PORT
              value: "50052"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: careerhub-mongodb-userinfo-userinfo-app
                  key: connectionString.standardSrv
            # OTel 트레이싱 (Phase 4-B) — Alloy(careerhub 텐넌트 전용)로 OTLP gRPC 송신.
            # X-Scope-OrgID 헤더는 Alloy가 상수 하드코딩으로 박으므로 본 컨테이너는 헤더 무지.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.prometheus.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(POD_NAMESPACE)"
