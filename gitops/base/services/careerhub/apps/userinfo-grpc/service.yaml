apiVersion: v1
kind: Service
metadata:
  name: userinfo-restapi
  labels:
    app: userinfo-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 80
      targetPort: restapi-grpc
  selector:
    app: userinfo-service
---
apiVersion: v1
kind: Service
metadata:
  name: userinfo-suggester
  labels:
    app: userinfo-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 80
      targetPort: suggester-grpc
  selector:
    app: userinfo-service
