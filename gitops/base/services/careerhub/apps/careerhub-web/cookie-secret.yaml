# 세션 쿠키 봉인 키 — 환경마다 클러스터 안에서 한 번 생성한다(jwt-secretkey 와 같은 방식). 값은 git 에 없다.
# 앱은 "base64 로 인코딩된 32바이트"를 요구한다 — 32자 비밀번호를 b64enc 해 그 모양을 만든다.
# CreatedOnce: 값이 바뀌면 기존 세션이 전부 만료되므로 재생성하지 않는다.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: careerhub-web-cookie-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: careerhub-web-cookie-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: careerhub-web-cookie-secret
    template:
      data:
        AUTH_COOKIE_SECRET: "{{ .password | b64enc }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: careerhub-web-cookie-secret
