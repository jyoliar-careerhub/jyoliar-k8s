apiVersion: batch/v1
kind: Job
metadata:
  name: review-migration
  labels:
    app: review-service
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: migrator
          image: REVIEW_SERVICE
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: careerhub-mongodb-review-review-app
                  key: connectionString.standardSrv
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: careerhub-mongodb-review-review-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: careerhub-mongodb-review-review-app
                  key: password
