apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: careerhub-nginx-gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    labels:
      implementation: kube-vip
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: careerhub-nginx-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-jyoliar-tls
      allowedRoutes:
        namespaces:
          from: All
