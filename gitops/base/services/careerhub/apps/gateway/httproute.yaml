apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: careerhub-httproute
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: careerhub-nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: frontend
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ''
          kind: Service
          name: api-composer
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - group: ''
          kind: Service
          name: auth-service
          port: 80
          weight: 1
