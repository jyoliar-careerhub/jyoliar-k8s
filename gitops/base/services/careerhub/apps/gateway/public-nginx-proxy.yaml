# 공개 Gateway 의 NginxProxy — 노출 방식(Service 타입)은 환경이 정한다.
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: careerhub-public-nginx-proxy
spec:
  kubernetes:
    service:
      type: OVERRIDE_REQUIRED
  telemetry:
    exporter:
      endpoint: alloy.prometheus.svc.cluster.local:4317
