apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  hostnames:
    - careerhub.jyo-liar.com
    - id.careerhub.jyo-liar.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: careerhub-nginx-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:	
        - path:	
            type: PathPrefix	
            value: /