# 공개 전용 Gateway — NGF 가 만드는 Service(careerhub-public-gateway-nginx)가
# 터널 ingress 의 careerhub 줄과 이름이 맞물린다. 클러스터 안 홉이라 HTTP 만 연다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: careerhub-public-gateway
  annotations:
    # ClusterIP Gateway 라 status 주소 대신 이 값이 레코드 대상이다.
    # cftunnel 은 jyoliar-platform-terraform(shared-cloudflare)이 소유한 터널 안정 이름 — UUID 는 그쪽 안에서만 돈다.
    external-dns.alpha.kubernetes.io/target: cftunnel.jyo-liar.com
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: careerhub-public-nginx-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
