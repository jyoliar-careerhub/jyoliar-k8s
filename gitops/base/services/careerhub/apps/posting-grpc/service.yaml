apiVersion: v1
kind: Service
metadata:
  name: posting-provider
  labels:
    app: posting-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 80
      targetPort: provider-grpc
  selector:
    app: posting-service
---
apiVersion: v1
kind: Service
metadata:
  name: posting-scanner
  labels:
    app: posting-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 80
      targetPort: scanner-grpc
  selector:
    app: posting-service
---
apiVersion: v1
kind: Service
metadata:
  name: posting-restapi
  labels:
    app: posting-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 80
      targetPort: restapi-grpc
  selector:
    app: posting-service
---
apiVersion: v1
kind: Service
metadata:
  name: posting-suggester
  labels:
    app: posting-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 80
      targetPort: suggester-grpc
  selector:
    app: posting-service
