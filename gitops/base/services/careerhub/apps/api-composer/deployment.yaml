apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-composer
  labels:
    app: api-composer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-composer
  template:
    metadata:
      labels:
        app: api-composer
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: api-composer
          image: API_COMPOSER
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_PORT
              value: "8080"
            - name: ROOT_PATH
              value: "/api"
            - name: POSTING_GRPC_ENDPOINT
              value: "posting-restapi:80"
            - name: USERINFO_GRPC_ENDPOINT
              value: "userinfo-restapi:80"
            - name: REVIEW_GRPC_ENDPOINT
              value: "review-restapi:80"
            # 발급자 검증(ADR-0029) — 기동 필수값. 없으면 신 세대 이미지는 즉시 종료한다.
            # JWKS는 {issuer}/oauth/v2/keys에서 받는다(OIDC_JWKS_URL 선택 — 비우면 그 규약).
            - name: OIDC_ISSUER
              value: "OVERRIDE_REQUIRED"
            # careerhub-web의 client_id — Zitadel 구성 Job이 같은 ns에 쓰는 앱 자격증명 Secret.
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: zitadel-app-careerhub-web
                  key: client_id
            # OTel 트레이싱 (Phase 4-B) — Alloy(careerhub 텐넌트 전용)로 OTLP gRPC 송신.
            # X-Scope-OrgID 헤더는 Alloy가 상수 하드코딩으로 박으므로 본 컨테이너는 헤더 무지.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.prometheus.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(POD_NAMESPACE)"
