apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: zitadel-masterkey
  data:
    # Zitadel Helm chart의 masterkeySecretName이 참조하는 Secret의 키 이름은 masterkey다.
    - secretKey: masterkey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "REPLACE_WITH_ENVIRONMENT_SPECIFIC_KEY"
        metadataPolicy: None
