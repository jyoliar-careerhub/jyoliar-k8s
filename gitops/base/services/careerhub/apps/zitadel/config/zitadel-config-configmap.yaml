# 구성 Job이 /config로 마운트하는 선언 — 내용은 config-render Component가 채운다.
# overlay가 config-render Component를 빠뜨리면 자리표시가 렌더에 남는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
data:
  zitadel-config.yaml: |
    idps: [OVERRIDE_REQUIRED]
    project: {OVERRIDE_REQUIRED: true}
    actions: {OVERRIDE_REQUIRED: true}
