# 구성 Job의 재실행 최적화 상태(zitadel-config-state ConfigMap)를 읽고 쓰기
# 위한 최소 권한 — Secret 접근은 없다(자격증명은 볼륨 마운트로 받는다).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-config-state
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-config-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-config-state
subjects:
  - kind: ServiceAccount
    name: zitadel-config
