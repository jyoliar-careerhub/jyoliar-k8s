# 구성 Job의 k8s 쪽 권한 — 재실행 최적화 상태(zitadel-config-state ConfigMap)와
# 앱 자격증명 Secret(선언의 credentialsSecret) 기록용.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-config-state
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
  # 앱 자격증명 Secret 기록 — client_secret이 생성·재발급 응답에 1회만 노출되어
  # Job 시점 포착이 유일한 자동화 경로다(apply_zitadel_config.py 헤더).
  # 이름 한정(resourceNames)을 두지 않는 이유: create는 API상 이름 한정이
  # 불가능한 동사이고, get·patch의 대상 이름은 overlay 선언에 있어 base Role에
  # 고정할 수 없다. list·watch·delete는 주지 않는다 — Job은 어차피 IAM_OWNER
  # PAT를 마운트로 쥐고 있어, 이 Role이 방어선의 본체는 아니다.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-config-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-config-state
subjects:
  - kind: ServiceAccount
    name: zitadel-config
