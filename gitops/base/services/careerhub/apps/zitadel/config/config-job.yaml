# Zitadel 내부 구성 Job — 선언(zitadel-config ConfigMap)을 관리 API로 수렴시킨다.
# ArgoCD PostSync hook: sync마다 재생성·재실행되고, 스크립트의 checksum 검사가
# 무변경 재실행을 no-op으로 만든다. 상세는 apply-zitadel-config.sh 헤더.
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-config-apply
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: zitadel-config-apply
    spec:
      restartPolicy: Never
      serviceAccountName: zitadel-config
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: apply
          # bash·kubectl 동봉 이미지 — 태그는 클러스터 서버 버전과 정렬한다
          # (2026-08-12 실측: 서버 v1.34.9, 이미지 amd64/arm64 제공).
          # 수렴 로직은 python3 + PyYAML에 의존하는데, 이 둘은 이미지의 공표
          # 도구 목록 밖이다(awscli v1의 의존으로 실재 — 1.34.9 실측:
          # Python 3.14.5 · PyYAML 6.0.3). 태그 인상 시 존재를 재확인할 것 —
          # entrypoint가 fail-fast로 검사한다.
          image: alpine/k8s:1.34.9
          command: ["bash", "/scripts/apply-zitadel-config.sh"]
          env:
            - name: ZITADEL_URL
              value: http://zitadel:8080
            # 인스턴스 판별용 Host 헤더 — chart의 ExternalDomain과 같은 값을
            # overlay가 주입한다(원천이 둘로 갈리는 것은 overlay 리뷰의 몫).
            - name: ZITADEL_EXTERNAL_DOMAIN
              value: OVERRIDE_REQUIRED
            - name: STATE_CONFIGMAP
              value: zitadel-config-state
            # 선언 속 {"$env": "..."}가 참조하는 시크릿 재료 — IdP 추가 시
            # 여기 env 쌍과 선언 항목이 함께 늘어난다.
            - name: IDP_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: IDP_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_SECRET
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: pat
              mountPath: /secrets/pat
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: zitadel-config-script
        - name: config
          configMap:
            name: zitadel-config
        - name: pat
          secret:
            # chart FirstInstance machine user 부트스트랩의 산출물(#55
            # Requirements가 못 박은 자격증명 경로) — setup Job 사이드카가 쓴다.
            secretName: iam-admin-pat
