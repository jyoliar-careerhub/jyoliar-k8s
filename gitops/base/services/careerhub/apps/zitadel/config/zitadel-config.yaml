# Zitadel 내부 구성의 원하는 상태 — 환경 무관 선언.
# 클러스터에 배포되지 않는다(local-config). overlay가 patch로 환경값을 얹고,
# config-render Component가 병합 결과를 zitadel-config ConfigMap 안으로 옮긴다.
# 구성 Job(config/apply-zitadel-config.sh)이 그 ConfigMap의 선언을 관리 API로 수렴시킨다.
# {$env: NAME}은 Job env 값으로 치환된다 — 시크릿이 git에 실리지 않는 배선.
apiVersion: careerhub.jyo-liar.com/v1alpha1
kind: ZitadelConfig
metadata:
  name: zitadel-config
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  idps:
    # 새 브로커 추가 = 여기 항목 추가 (+ 시크릿이 필요하면 Job env 쌍 배선).
    # type이 admin API 경로(/admin/v1/idps/<type>)가 된다 — Naver(추후 예정)는
    # generic_oidc로 붙는다(ADR-0030). 스크립트에 제공자 전용 분기는 없다.
    - name: Google
      type: google
      addToLoginPolicy: true
      config:
        clientId: {$env: IDP_GOOGLE_CLIENT_ID}
        clientSecret: {$env: IDP_GOOGLE_CLIENT_SECRET}
        scopes: [openid, profile, email]
        providerOptions:
          isLinkingAllowed: true
          isCreationAllowed: true
          isAutoCreation: true
          isAutoUpdate: true
          autoLinking: AUTO_LINKING_OPTION_EMAIL

  project:
    name: careerhub
    # apps는 앱 이름을 키로 하는 맵이다 — overlay의 patch가 앱 단위로 병합되게 하려는 것.
    # 목록으로 두면 kustomize가 항목을 맞추지 못하고 통째로 교체한다.
    apps:
      careerhub-web:
        # 앱 자격증명 접점 — 구성 Job이 수렴 후 이 이름의 k8s Secret에 client_id와
        # client_secret을 기록한다(같은 ns). 소비자는 이 Secret을 참조한다.
        # careerhub-web은 secret 인증(BASIC) 앱이라 두 키가 함께 실린다 —
        # public(NONE)·PRIVATE_KEY_JWT 앱이라면 client_id뿐이다.
        credentialsSecret: zitadel-app-careerhub-web
        oidc:
          # redirectUris · postLogoutRedirectUris · devMode는 여기 없다 — 환경값이라
          # overlay의 patch(zitadel-config-env/zitadel-config-patch.yaml)가 넣는다.
          responseTypes: [OIDC_RESPONSE_TYPE_CODE]
          grantTypes:
            - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
            - OIDC_GRANT_TYPE_REFRESH_TOKEN
          # confidential client(#75) — code 교환을 Next 서버가 수행하므로 앱이
          # secret을 쥘 수 있다. WEB+BASIC이라야 client_secret이 발급된다.
          # POST가 아니라 BASIC인 이유: 소비자 careerhub-web은 Basic 인증만
          # 구현했다(교환·갱신 모두 Authorization 헤더 — form에 client_secret을
          # 싣는 경로가 없다). 둘 다 secret은 발급되므로 POST로 선언하면 교환
          # 단계에서야 깨진다.
          # PKCE는 이 전환과 직교한다 — Zitadel은 authorize 때 받은 code_challenge를
          # 클라이언트 인증 방식과 무관하게 먼저 검증한다. Basic + PKCE가 함께 선다.
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          # JWT 액세스 토큰 — 로컬 검증(ADR-0029)·발급 시점 주입(ADR-0031)의 전제.
          accessTokenType: OIDC_TOKEN_TYPE_JWT

  actions:
    targets:
      - name: auth-service-claims
        # 같은 ns의 auth-service 발급 훅 표면(spec/issuance-hook) — ns 무관 상대참조.
        endpoint: http://auth-service:8081/claims
        timeout: 5s
        restCall:
          # fail-closed (#55 D1, 사람 판정 2026-08-12): 빈 클레임 토큰은 앱에서
          # 어차피 정상 동작하지 않고, 조용한 실패는 탐지가 어렵다 — auth-service
          # 장애를 로그인 실패로 드러낸다. function execution은 인스턴스 전역
          # 발화라 타 프로젝트 로그인도 함께 묶인다는 것을 알고 켠 스위치다.
          interruptOnError: true
    executions:
      - function: preaccesstoken
        targets: [auth-service-claims]
      - function: preuserinfo
        targets: [auth-service-claims]
