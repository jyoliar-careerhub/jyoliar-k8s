apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: auth-service
          image: AUTH_SERVICE
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_PORT
              value: "8080"
            - name: MAILER_GRPC_PORT
              value: "50051"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_REDIRECT_URL
            - name: ACCESS_CONTROL_ALLOW_ORIGIN
              value: "careerhub.jyo-liar.com"
            - name: DB_HOST
              value: "careerhub-postgresql-pooler-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "auth"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-app-pg-password
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-app-pg-password
                  key: password
          envFrom:
            - secretRef:
                name: jwt-secretkey
