apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: auth-service
          image: AUTH_SERVICE
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUN_MODE
              value: "app"
            - name: API_PORT
              value: "8080"
            - name: MAILER_GRPC_PORT
              value: "50051"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_REDIRECT_URL
            - name: ACCESS_CONTROL_ALLOW_ORIGIN
              value: "REPLACE_WITH_ENVIRONMENT_SPECIFIC_VALUE"
            - name: DB_HOST
              value: "careerhub-postgresql-pooler"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "auth"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-app-pg-password
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-app-pg-password
                  key: password
            # OTel 트레이싱 (Phase 4-B) — Alloy(careerhub 텐넌트 전용)로 OTLP gRPC 송신.
            # X-Scope-OrgID 헤더는 Alloy가 상수 하드코딩으로 박으므로 본 컨테이너는 헤더 무지.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.prometheus.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(POD_NAMESPACE)"
          envFrom:
            - secretRef:
                name: jwt-secretkey
