apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: careerhub-mongodb
spec:
  members: OVERRIDE_REQUIRED
  arbiters: OVERRIDE_REQUIRED
  type: ReplicaSet
  version: "8.0.19"
  security:
    authentication:
      modes: ["SCRAM"]
    roles: []
  users:
    - name: mongodb-admin
      db: admin
      passwordSecretRef:
        name: mongodb-admin-password
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
      scramCredentialsSecretName: mongodb-admin-scram
    - name: mongodb-readonly
      db: admin
      passwordSecretRef:
        name: mongodb-readonly-password
      roles:
        - name: readAnyDatabase
          db: admin
      scramCredentialsSecretName: mongodb-readonly-scram
    - name: review-app
      db: review
      passwordSecretRef:
        name: review-app-password
      roles:
        - name: readWrite
          db: review
      scramCredentialsSecretName: review-app-scram
    - name: review-migrator
      db: review
      passwordSecretRef:
        name: review-migrator-password
      roles:
        - name: dbOwner
          db: review
      scramCredentialsSecretName: review-migrator-scram
    - name: posting-app
      db: posting
      passwordSecretRef:
        name: posting-app-password
      roles:
        - name: readWrite
          db: posting
      scramCredentialsSecretName: posting-app-scram
    - name: posting-migrator
      db: posting
      passwordSecretRef:
        name: posting-migrator-password
      roles:
        - name: dbOwner
          db: posting
      scramCredentialsSecretName: posting-migrator-scram
    - name: userinfo-app
      db: userinfo
      passwordSecretRef:
        name: userinfo-app-password
      roles:
        - name: readWrite
          db: userinfo
      scramCredentialsSecretName: userinfo-app-scram
    - name: userinfo-migrator
      db: userinfo
      passwordSecretRef:
        name: userinfo-migrator-password
      roles:
        - name: dbOwner
          db: userinfo
      scramCredentialsSecretName: userinfo-migrator-scram
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume # volumeMounts.name과 동일해야 함
          spec:
            accessModes: ["ReadWriteOnce"] # RWO, RWX, ROX 등
            resources:
              requests:
                storage: OVERRIDE_REQUIRED
            volumeMode: Filesystem # 또는 Block
        - metadata:
            name: logs-volume # volumeMounts.name과 동일해야 함
          spec:
            accessModes: ["ReadWriteOnce"] # RWO, RWX, ROX 등
            resources:
              requests:
                storage: OVERRIDE_REQUIRED
            volumeMode: Filesystem # 또는 Block
      template:
        metadata:
          labels:
            scheduling.mongodb.com/cluster: careerhub
        spec:
          containers:
            # operator 기본값은 memory limit 500M — 평소 사용량(약 400M)에 여유가 100M 뿐이라
            # 인덱스 빌드 · 컨테이너 안 mongosh 같은 일시 부하에 OOM 으로 죽는다. limit 만 올린다
            # (WiredTiger 캐시는 256MB 그대로라 평소 사용량은 늘지 않는다). 나머지는 operator 기본값과 같다.
            - name: mongod
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: 500m
                  memory: 400M
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: scheduling.mongodb.com/cluster
                        operator: In
                        values: ["careerhub"]
                      - key: statefulset.kubernetes.io/pod-name
                        operator: NotIn
                        values: ["careerhub-mongodb-arb-0"]
                  topologyKey: kubernetes.io/hostname
