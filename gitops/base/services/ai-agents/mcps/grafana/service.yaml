# mcp-grafana Service: :80 → 8000. 접근 URL http://mcp-grafana.prometheus.svc/mcp
# kagent RemoteMCPServer(system/kagent-config)가 이 URL로 도구를 발견·호출한다(Step 6).
apiVersion: v1
kind: Service
metadata:
  name: mcp-grafana
  namespace: prometheus
  labels:
    app: mcp-grafana
spec:
  selector:
    app: mcp-grafana
  ports:
    - name: http
      port: 80
      targetPort: 8000
