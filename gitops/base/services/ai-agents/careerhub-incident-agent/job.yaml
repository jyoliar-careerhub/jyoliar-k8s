# G0 검증용 1회성 Job — 완전 GitOps. careerhub migration-job 선례대로 ArgoCD Sync hook으로 실행한다.
#  - hook: Sync                          → ArgoCD sync 시점에 1회 실행(일반 prune/selfHeal drift 루프에 안 걸림)
#  - hook-delete-policy: BeforeHookCreation → 다음 sync 때 이전 Job 삭제 후 재생성(G0 재검증 = sync 재실행)
#  - sync-wave: "1"                      → ExternalSecret(기본 wave 0)이 Secret을 만든 뒤 Job이 돌도록 보장
# 이미지는 placeholder(INCIDENT_AGENT)로 두고, 실제 ECR URL/태그는 agent overlay
# (careerhub-incident-agent/kustomization.yaml)의 images로 주입한다(careerhub apps 패턴). 재빌드 시 newTag만 갱신.
apiVersion: batch/v1
kind: Job
metadata:
  name: incident-agent-g0
  namespace: ai-agents
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: incident-agent
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: agent
          image: INCIDENT_AGENT
          command: ["python", "agent.py"]
          env:
            - name: TARGET_NS
              value: careerhub-prod
            - name: PROM_URL
              value: http://monitoring-kube-prometheus-prometheus.prometheus.svc:9090
            - name: INCIDENT_SUMMARY
              value: "TestIncidentFire: api-composer 5xx 급증"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: incident-agent-secret
                  key: openai-api-key
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: incident-agent-secret
                  key: discord-webhook-url
