apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 완전 GitOps: 상시 인프라 + G0 검증 Job(Sync hook)을 모두 포함한다.
# job.yaml은 ArgoCD Sync hook이라 일반 리소스 drift/prune 루프에 걸리지 않고 sync마다 1회 실행된다.
resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - externalsecret.yaml
  - job.yaml
