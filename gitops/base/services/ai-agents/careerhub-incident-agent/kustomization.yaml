apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# incident-agent 워크로드: 상시 인프라(SA/RBAC/ExternalSecret) + 실행 정의(CronJob, suspend).
# CronJob은 suspend라 자동 실행되지 않고, 검증 시 수동으로 Job을 띄워 실행한다(cronjob.yaml 주석 참조).
resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - externalsecret.yaml
  - cronjob.yaml
