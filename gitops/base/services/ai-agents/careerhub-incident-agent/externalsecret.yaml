# incident-agent-secret: OpenAI 키 + Discord 웹훅 URL — 완전 GitOps(둘 다 ExternalSecret).
# - openai-api-key:      kagent와 동일 SSM 경로 재사용(plain SecureString, property 없음).
# - discord-webhook-url: 기존 alert-slack-webhook ExternalSecret이 쓰는 SSM 경로/프로퍼티를 그대로 재사용.
#     (소스: gitops/overlays/baremetal/system/prometheus-config/alert-slack-webhook-secret.yaml
#      → key=/jyo-liar/k8s/baremetal/prometheus/slack-webhook, property=info)
#     현재 Discord 게시가 Slack 호환 /slack 엔드포인트라 alertmanager info 웹훅과 동일 값이므로
#     신규 SSM 쓰기 없이 이 경로를 참조 → 수동 Secret(incident-agent-discord) 방식 폐기.
#     전용 채널 분리 시에만 신규 SSM 경로 등록(후속).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: incident-agent-secret
  namespace: ai-agents
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  # external-secrets v1 CRD는 refreshPolicy enum을 요구한다(미지정 시 SSA가 ""로 넣어 거부됨).
  # refreshInterval 사용 시 Periodic이 의미상 맞다(동일 클러스터 google-oauth 검증값).
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: incident-agent-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: openai-api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "/jyo-liar/k8s/baremetal/kagent/openai-api-key"
    - secretKey: discord-webhook-url
      remoteRef:
        key: "/jyo-liar/k8s/baremetal/prometheus/slack-webhook"
        property: info
