# incident-agent-secret: OpenAI 키 + Discord 웹훅 URL — 완전 GitOps(둘 다 ExternalSecret).
# 경로/property는 클러스터에서 이미 동작 중인 ExternalSecret을 그대로 따른다:
# - openai-api-key:      kagent-openai ExternalSecret과 동일
#     (key=/jyo-liar/k8s/baremetal/kagent/openai-api-key, plain 값이라 property 없음)
# - discord-webhook-url: alert-slack-webhook ExternalSecret과 동일 Parameter Store 경로
#     (key=/jyo-liar/k8s/baremetal/discord/slack-webhook-url, plain 값이라 property 없음)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: incident-agent-secret
  namespace: ai-agents
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: incident-agent-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # conversionStrategy/decodingStrategy/metadataPolicy: CRD가 기본값으로 채우는 필드.
    # git에 명시하지 않으면 ArgoCD가 live(기본값 채워짐) vs desired(누락) 차이로 영구 OutOfSync.
    # 동작 중인 kagent-openai ExternalSecret과 동일하게 명시한다.
    - secretKey: openai-api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "/jyo-liar/k8s/baremetal/kagent/openai-api-key"
    - secretKey: discord-webhook-url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "/jyo-liar/k8s/baremetal/discord/slack-webhook-url"
