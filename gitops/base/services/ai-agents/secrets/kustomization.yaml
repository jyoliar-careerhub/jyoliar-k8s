apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ai-agents 공유 secret 레이어 — ECR pull secret(ecr-image-puller SA + ECRAuthorizationToken + ExternalSecret).
# 모든 agent가 같은 ai-agents 네임스페이스에서 이 secret을 imagePullSecrets로 참조하므로,
# agent별 base가 아니라 공유 레이어로 분리한다. ApplicationSet에서 phase 1로 먼저 동기화한다.
# (careerhub apps/secrets 패턴). 향후 다른 공통 secret도 여기에 추가한다.
resources:
  - ecr-pull-secret.yaml
  - ai-agent-discord-webhook.yaml
