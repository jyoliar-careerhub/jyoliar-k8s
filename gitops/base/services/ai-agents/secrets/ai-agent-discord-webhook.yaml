# ai-agent-discord-webhook: AI agent 전용 Discord 채널 webhook URL — ai-agents 공유 secret 레이어.
# 모든 agent가 동일 ai-agents 네임스페이스에서 이 secret을 참조해 알림을 게시한다.
# Parameter Store 경로는 terraform alert 워크스페이스가 생성한다:
#   /jyo-liar/k8s/baremetal/discord/ai-agent-webhook-url
#   (discord_webhook.ai_agent.slack_url, plain SecureString 단일 문자열 — JSON 맵 아님)
# conversionStrategy/decodingStrategy/metadataPolicy: CRD 기본값. git에 명시하지 않으면
# ArgoCD가 live(기본값 채워짐) vs desired(누락) 차이로 영구 OutOfSync가 되므로 명시한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-agent-discord-webhook
  namespace: ai-agents
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: ai-agent-discord-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "/jyo-liar/k8s/baremetal/discord/ai-agent-webhook-url"
