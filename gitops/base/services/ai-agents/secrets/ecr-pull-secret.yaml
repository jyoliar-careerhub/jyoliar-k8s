# ECR pull secret — careerhub 패턴 복제(ECRAuthorizationToken 생성기 + ExternalSecret).
# ecr-image-puller SA의 IRSA(role-arn)로 ECR 토큰을 발급한다.
# 주의: IAM role(ecr-image-puller)의 trust policy가 careerhub-prod/dev 네임스페이스로
#       스코프되어 있으면 ai-agents SA는 AssumeRoleWithWebIdentity 거부될 수 있다(검증 필요).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-image-puller
  namespace: ai-agents
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::986069063944:role/ecr-image-puller"
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-token
  namespace: ai-agents
spec:
  region: ap-northeast-2
  auth:
    jwt:
      serviceAccountRef:
        name: ecr-image-puller
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-pull-secret
  namespace: ai-agents
spec:
  refreshInterval: "6h0m0s"
  target:
    name: ecr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          expiresAt: "{{ .expires_at }}"
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .proxy_endpoint | replace "https://" "" }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-token
