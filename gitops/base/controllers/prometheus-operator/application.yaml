apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: monitoring-grafana
    namespace: prometheus
    jsonPointers:
    - /data/admin-password
  - group: "apps"
    kind: Deployment
    name: monitoring-grafana
    namespace: prometheus
    jsonPointers:
    - /spec/template/metadata/annotations/checksum~1secret
  destination:
    namespace: prometheus
    server: https://kubernetes.default.svc
  project: controllers
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts/
    targetRevision: 82.10.3
    helm:
      releaseName: monitoring
      valuesObject:
        namespaceOverride: "prometheus"
        defaultRules:
          create: true
          rules:
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: true
            kubernetesResources: false
            kubernetesApps: false
            kubernetesStorage: false
            nodeExporterAlerting: false
        crds:
          upgradeJob:
            enabled: true
            forceConflicts: true
        # KSM 자기 텔레메트리(kube_state_metrics_list_total 등) 노출 — KubeStateMetrics* 알럿의
        # 데이터 원천. 미노출 상태로는 해당 알럿 4종이 상시 무력 (ops-workflow#26 promcheck 실측)
        kube-state-metrics:
          selfMonitor:
            enabled: true
        prometheus-node-exporter:
          # extraArgs는 리스트 교체(merge 아님) — 차트 기본 filesystem 제외 2항을 유지한 채 추가
          extraArgs:
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
            # NodeSystemdService{Failed,Crashlooping} 알럿의 데이터 원천 (node_systemd_unit_state ·
            # node_systemd_service_restart_total). .service 단위로 한정해 카디널리티 완충
            - --collector.systemd
            - --collector.systemd.unit-include=.+\.service
            - --collector.systemd.enable-restarts-metrics
          extraHostVolumeMounts:
            # systemd collector는 호스트 D-Bus로 systemd에 질의 — 읽기 전용 소켓 마운트
            - name: dbus
              hostPath: /var/run/dbus/system_bus_socket
              mountPath: /var/run/dbus/system_bus_socket
              readOnly: true
        grafana:
          additionalDataSources:
            - name: Loki - careerhub
              uid: loki-careerhub
              type: loki
              access: proxy
              url: http://loki.prometheus.svc.cluster.local:3100
              isDefault: false
              jsonData:
                maxLines: 1000
                httpHeaderName1: X-Scope-OrgID
                # 로그의 "trace_id":"<id>" JSON 필드를 발견하면 Tempo 트레이스 뷰로 점프 (Phase 3-2)
                # careerhub 백엔드는 goutils/llog가 JSON 출력 (datas.trace_id 필드).
                # 전환기 동안 goutils UUID(36자, hyphen 포함)와 OTel TraceID(32 hex) 양쪽을 cover하기 위해
                # broad regex `([^"]+)` 사용. (Phase 4-B 사전 조사 §5.2 참조)
                derivedFields:
                  - name: TraceID
                    datasourceUid: tempo-careerhub
                    matcherRegex: '"trace_id":"([^"]+)"'
                    url: '$${__value.raw}'
              secureJsonData:
                httpHeaderValue1: careerhub
            # Phase 3-1: Tempo - careerhub datasource
            # 헤더 X-Scope-OrgID=careerhub 강제, multitenancy 격리. α 패턴 송신 헤더와 동일 텐넌트.
            - name: Tempo - careerhub
              uid: tempo-careerhub
              type: tempo
              access: proxy
              url: http://tempo.prometheus.svc.cluster.local:3200
              isDefault: false
              jsonData:
                httpHeaderName1: X-Scope-OrgID
                # 트레이스 뷰에서 해당 trace_id로 Loki 로그를 동시 조회
                tracesToLogsV2:
                  datasourceUid: loki-careerhub
                  spanStartTimeShift: '-1m'
                  spanEndTimeShift: '1m'
                  filterByTraceID: true
                  tags:
                    - key: service.name
                      value: app
                # Service Graph는 Tempo metrics_generator 메트릭(traces_service_graph_*)을
                # Prometheus에서 조회. metrics_generator는 Phase 1에서 미활성 — 패널은 비어
                # 표시되며, 향후 활성화 시 자동 동작.
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
              secureJsonData:
                httpHeaderValue1: careerhub
        prometheus:
          prometheusSpec:
            # Alloy spanmetrics 분기의 prometheus.remote_write 를 받는다 (ops-workflow#101).
            # --web.enable-remote-write-receiver → POST /api/v1/write 개방 (클러스터 내부만).
            enableRemoteWriteReceiver: true
        alertmanager:
          alertmanagerSpec:
            alertmanagerConfigMatcherStrategy:
              type: None
            externalUrl: null
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
