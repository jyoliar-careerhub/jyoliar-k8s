apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: external-dns
    server: https://kubernetes.default.svc
  project: controllers
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.20.0
    helm:
      releaseName: external-dns
      valuesObject:
        sources:
          - gateway-httproute
        provider:
          name: cloudflare
        domainFilters:
          - jyo-liar.com
        policy: upsert-only
        registry: txt
        txtOwnerId: homelab-external-dns
        txtPrefix: _edns.
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token
        extraArgs:
          - --cloudflare-dns-records-per-page=5000
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
