apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: prometheus
    server: https://kubernetes.default.svc
  project: controllers
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.7.0
    helm:
      releaseName: alloy
      valuesObject:
        alloy:
          configMap:
            create: true
            content: |
              // Pod discovery — current node only
              discovery.kubernetes "pod" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }

              // Relabel — keep *-(prod|dev|staging|test) namespaces only, extract tenant ID and env
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pod.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex         = ".+-(prod|dev|staging|test)$"
                  action        = "keep"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex         = "(.+)-(prod|dev|staging|test)$"
                  replacement   = "$1"
                  target_label  = "tenant_id"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex         = ".+-(prod|dev|staging|test)$"
                  replacement   = "$1"
                  target_label  = "env"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_id"]
                  regex         = "^(\\S+):\\/\\/.+$"
                  replacement   = "$1"
                  target_label  = "container_runtime"
                }
              }

              // Tail logs from discovered pods
              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.process.pod_logs.receiver]
              }

              // Process — CRI parsing + level label extraction + dynamic tenant routing
              loki.process "pod_logs" {
                stage.cri {}

                // Extract log level from JSON logs (INFO, WARN, ERROR)
                // Non-JSON logs (e.g. frontend) will simply not have the level label
                stage.json {
                  expressions = {
                    level = "level",
                  }
                }

                stage.labels {
                  values = {
                    level = "",
                  }
                }

                stage.tenant {
                  label = "tenant_id"
                }

                stage.label_drop {
                  values = ["tenant_id", "container_runtime"]
                }

                forward_to = [loki.write.loki.receiver]
              }

              // Write to Loki
              loki.write "loki" {
                endpoint {
                  url = "http://loki.prometheus.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              // ===========================================================
              // Traces pipeline — OTLP receive → Tempo forward
              // per-tenant Collector + 단일 텐넌트 하드코딩 패턴
              // ===========================================================
              // 본 Alloy 인스턴스는 careerhub 텐넌트 전용. X-Scope-OrgID는
              // outbound exporter에서 상수 하드코딩으로 박는다. 송신자는
              // 텐넌트 헤더 무지(NGF/careerhub 백엔드/telemetrygen 등).
              // 동적 매핑(namespace→tenant 등) 일체 미사용.
              // 신규 텐넌트 합류 시 노드 그룹 분리 + per-node-group Alloy로
              // 별도 인스턴스 배포 예정.

              // OTLP 수신 (gRPC 4317 + HTTP 4318)
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  traces = [otelcol.processor.k8sattributes.default.input]
                }
              }

              // k8s 메타데이터 자동 부착 (디버깅 가치, 격리와는 무관)
              otelcol.processor.k8sattributes "default" {
                extract {
                  metadata = [
                    "k8s.namespace.name",
                    "k8s.pod.name",
                    "k8s.deployment.name",
                    "k8s.container.name",
                  ]
                }
                pod_association {
                  source {
                    from = "resource_attribute"
                    name = "k8s.pod.ip"
                  }
                }
                pod_association {
                  source {
                    from = "connection"
                  }
                }
                output {
                  traces = [otelcol.processor.batch.traces.input]
                }
              }

              otelcol.processor.batch "traces" {
                output {
                  traces = [otelcol.exporter.otlphttp.tempo.input]
                }
              }

              // outbound 헤더에 텐넌트 ID를 상수 하드코딩
              otelcol.auth.headers "tenant" {
                header {
                  key   = "X-Scope-OrgID"
                  value = "careerhub"
                }
              }

              // Tempo로 export
              otelcol.exporter.otlphttp "tempo" {
                client {
                  endpoint = "http://tempo.prometheus.svc.cluster.local:4318"
                  auth     = otelcol.auth.headers.tenant.handler
                }
              }
          mounts:
            varlog: true
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          clustering:
            enabled: false
        controller:
          type: daemonset
        serviceAccount:
          create: true
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
