apiVersion: apps/v1
kind: Deployment
metadata:
  name: promcheck
  namespace: prometheus
  labels: { app: promcheck }
spec:
  replicas: 1
  selector:
    matchLabels: { app: promcheck }
  template:
    metadata:
      labels: { app: promcheck }
    spec:
      containers:
        - name: promcheck
          image: ghcr.io/cbrgm/promcheck:v1.2.48
          args:
            # 룰 원천: --check.file이 없으면 이 Prometheus의 /api/v1/rules에서
            # 로드된 룰 전체를 직접 가져온다 → 파일 접근·ConfigMap 이름 결합 없음
            - --prometheus.url=http://monitoring-kube-prometheus-prometheus.prometheus.svc:9090
            - --exporter.enabled=true
            - --exporter.addr=0.0.0.0:9212
            - --exporter.interval=300
            - --check.delay=0.1
            # ── 화이트리스트 (부분 매치 정규식 · ops-workflow#26 2차 배포) ──
            # 실측 전수 조사로 확정한 "정당하게 빈 셀렉터"만 배제한다.
            # kubelet_volume_stats_* 등 실사각 경로는 넣지 않는다 (본론 감시 대상).
            # scheduler 히스토그램·etcd peer 카운터(재시작-일과성)는 신호로 유지 — 미배제.
            # ① 카나리 — 화이트리스트 동작 검증용 (AC ⑤)
            - --check.ignore-selector=jyoliar_promcheck_canary_nonexistent_metric
            # ② PVC 룰 unless 예외 절 — ROX PVC·제외 라벨 PVC가 없는 한 상시 공집합
            - '--check.ignore-selector=access_mode="ReadOnlyMany"'
            - --check.ignore-selector=label_excluded_from_alerts
            # ③ 이벤트형 — 조건 발생 시에만 시계열 생성, 비어있음 = 건강
            - --check.ignore-selector=kube_pod_container_status_waiting_reason
            # KSM은 Job의 Failed condition이 실재할 때만 kube_job_failed를 노출한다
            # (Complete만 있는 Job은 미노출) → 실패 Job이 없으면 상시 공집합.
            # 2차 배포 시점에는 실패 Job이 남아 있어 통과했고, TTL로 정리된 뒤 발화.
            - --check.ignore-selector=kube_job_failed
            - --check.ignore-selector=owner_kind
            - --check.ignore-selector=kubelet_evictions
            - --check.ignore-selector=node.kubernetes.io/unreachable
            - --check.ignore-selector=ToBeDeletedByClusterAutoscaler
            - '--check.ignore-selector=result="error"'
            # apiserver 쓰기 5xx·요청 종료 카운터 — 이벤트 발생 시에만 생기고 apiserver
            # 재시작 시 소멸 (kube-vip VIP로 한 대에 몰려 그 재기동이 거의 전부를 지움).
            # 쓰기 변형만 좁게: 읽기 5xx는 기동 중 GET /readyz 500이 매 재시작 시드.
            # 분모 셀렉터(code 없음)는 검사가 남는다. (ops-workflow#151)
            # promcheck는 매처를 정렬한 문자열(code,job,verb 순)에 매치한다
            # (VectorSelector.String의 sort.Strings) — 원문 순서로 쓰면 매치되지 않는다.
            # ⚠ 값에 쉼표 금지 — 플래그 파서(kong)가 []string 값을 쉼표로 쪼갠다.
            #   쉼표는 정규식 이스케이프 \x2c 로 쓴다 (맨 쉼표로 쓰면 job="apiserver"
            #   단독 패턴이 생겨 apiserver 셀렉터 전부가 검사에서 빠진다).
            - '--check.ignore-selector=code=~"5\.\."\x2cjob="apiserver"\x2cverb=~"POST\|PUT\|PATCH\|DELETE"'
            - --check.ignore-selector=apiserver_request_terminations_total
            # ④ 구조적 공집합·미사용 기능 (chart 소유 룰 — 삭제 불가)
            - --check.ignore-selector=integration!~
            - --check.ignore-selector=prometheus_remote_storage_
            - --check.ignore-selector=prometheus_sd_refresh_failures_total
            - --check.ignore-selector=container_memory_swap
            # ⑤ 기능 미보유 — 룰은 유지(추후 도입 대비), 소음만 배제 (사람 결정)
            - --check.ignore-selector=kube_resourcequota
            - --check.ignore-selector=kube_horizontalpodautoscaler_
            - --check.ignore-selector=node_md_disks
            - --check.ignore-selector=node_bonding_
          ports:
            - { name: metrics, containerPort: 9212 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
