apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kagent
    server: https://kubernetes.default.svc
  project: controllers
  source:
    chart: kagent-crds
    repoURL: ghcr.io/kagent-dev/kagent/helm
    targetRevision: 0.9.0-beta5
    helm:
      releaseName: kagent-crds
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
