# 로컬 Claude Code 하네스(ops-workflow · ticket-engineer) 공용 read-only(Viewer) 서비스 계정.
# operator가 토큰을 Secret(read-for-agent-token)으로 prometheus ns(CR과 same-ns)에
# 생성한다. 두 하네스가 이 토큰 하나를 공유한다 — Grafana 쪽 신원 분리는 하지 않는다.
# 사람이 Secret에서 토큰을 꺼내 로컬 gitignored 자리에 둔다(agent 권한으로는 값을 못 읽는다).
# 만료를 두지 않는다 — 유출 의심 시 Secret 삭제·재생성으로 회전한다.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: read-for-agent
  namespace: prometheus
spec:
  instanceName: monitoring-external
  name: read-for-agent
  role: Viewer
  tokens:
    - name: read-for-agent-token
      secretName: read-for-agent-token
