# read-only(Viewer) 서비스 계정 + 토큰. operator가 토큰을 Secret(mcp-grafana-token)으로
# prometheus ns(CR과 same-ns)에 생성한다. mcp-grafana(prometheus ns)가 이 Secret을 읽는다.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: mcp-grafana-reader
  namespace: prometheus
spec:
  instanceName: monitoring-external
  name: mcp-grafana-reader
  role: Viewer
  tokens:
    - name: mcp-grafana-token
      secretName: mcp-grafana-token
