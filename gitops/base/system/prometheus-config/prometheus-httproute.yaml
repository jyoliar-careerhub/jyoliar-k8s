apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-httproute
spec:
  hostnames:
    - <PROMETHEUS_URL>
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-nginx-gateway
      namespace: nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: monitoring-kube-prometheus-prometheus
          port: 9090
          weight: 1
