apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-httproute
spec:
  hostnames:
    - <ALERTMANAGER_DOMAIN>
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-nginx-gateway
      namespace: nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: monitoring-kube-prometheus-alertmanager
          port: 9093
          weight: 1
