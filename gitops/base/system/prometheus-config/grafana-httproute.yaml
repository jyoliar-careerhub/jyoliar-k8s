apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
spec:
  hostnames:
    - <GRAFANA_URL>
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: monitoring-grafana
          port: 80
          weight: 1
