apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: hello-readonly
  namespace: kagent
spec:
  type: Declarative
  description: "Phase 2 왕복 검증용 Hello-World 에이전트. 읽기 전용 K8s tool 1개만 화이트리스트."
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      당신은 Phase 2 왕복 검증용 Hello-World 에이전트입니다.
      사용 가능한 도구는 단 한 개:
        - k8s_get_available_api_resources : 클러스터에 등록된 API 리소스 종류(kind/group) 목록을 조회.
      운영 명령(create/update/delete/patch/apply 등)은 절대 수행하지 않으며,
      해당 요청이 들어오면 "권한이 없다 / 도구가 없다"는 이유를 짧게 설명하고 거절합니다.
      허용된 도구로 답할 수 있는 질문이 아니면, 자연어로만 답변합니다.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_available_api_resources
