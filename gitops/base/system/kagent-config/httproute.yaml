apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-ui-httproute
  namespace: kagent
spec:
  hostnames:
    - <KAGENT_URL>
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: kagent-ui
          port: 8080
          weight: 1
