apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds
  namespace: argocd
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: k8s-repo-creds
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: k8s
        url: git@github.com:jae2274/jyoliar-k8s.git
        type: git
        sshPrivateKey: |
          {{ .sshPrivateKey }}
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: "REPLACE_WITH_ENVIRONMENT_SPECIFIC_KEY"
