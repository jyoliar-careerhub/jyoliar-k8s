apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-nginx-config
  namespace: oidc-provider
data:
  default.conf: |
    server {
      listen 8080;

      location = /.well-known/openid-configuration {
        alias /usr/share/nginx/html/openid-configuration;
        default_type application/json;
      }

      location = /openid/v1/jwks {
        alias /usr/share/nginx/html/jwks;
        default_type application/json;
      }

      location / {
        return 404;
      }
    }
