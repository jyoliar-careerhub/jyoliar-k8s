apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.2.0
          command:
            - cloudflared
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - run
            - $(TUNNEL_ID)
          env:
            - name: TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: tunnel-id
          volumeMounts:
            - name: cloudflared
              mountPath: /etc/cloudflared
              readOnly: true
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: cloudflared
          projected:
            sources:
              - configMap:
                  name: cloudflared-config
                  items:
                    - key: config.yml
                      path: config.yml
              - secret:
                  name: cloudflare-tunnel-token
                  items:
                    - key: credentials.json
                      path: credentials.json
