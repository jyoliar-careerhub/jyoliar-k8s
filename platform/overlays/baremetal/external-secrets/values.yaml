external-secrets:
  installCRDs: true

  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::986069063944:role/homelab-k8s-external-secrets"

  extraEnv:
    - name: AWS_REGION
      value: ap-northeast-2
    - name: AWS_ROLE_ARN
      value: "arn:aws:iam::986069063944:role/homelab-k8s-external-secrets"
    - name: AWS_WEB_IDENTITY_TOKEN_FILE
      value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token

  extraVolumes:
    - name: aws-iam-token
      projected:
        sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 86400
              path: token

  extraVolumeMounts:
    - name: aws-iam-token
      mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
      readOnly: true
