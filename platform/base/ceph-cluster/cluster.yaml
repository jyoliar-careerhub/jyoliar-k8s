apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false

  mon:
    count: 3
    allowMultiplePerNode: false

  mgr:
    count: 2
    modules:
      - name: pg_autoscaler
        enabled: true

  dashboard:
    enabled: true
    port: 8443
    ssl: true

  monitoring:
    enabled: false

  crashCollector:
    disable: false

  logCollector:
    enabled: true
    periodicity: 24h

  storage:
    useAllNodes: false
    useAllDevices: false
    config:
      osdsPerDevice: "1"
    nodes:
      - name: "ip-10-0-25-104"
        devices:
          - name: "nvme0n1"
      - name: "ip-10-0-25-105"
        devices:
          - name: "nvme0n1"
      - name: "ip-10-0-25-106"
        devices:
          - name: "nvme1n1"

  resources:
    mgr:
      limits:
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
    mon:
      limits:
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
    osd:
      limits:
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "2Gi"

  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthyRegex: "^(active\\+clean|active\\+clean\\+scrubbing|active\\+clean\\+scrubbing\\+deep)$"

  removeOSDsIfOutAndSafeToRemove: false
